name: OS verification

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify

  linux-static-smoke:
    runs-on: ubuntu-24.04
    env:
      ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/.eliza-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: elizaOS/eliza
          ref: f6d8f8ee7f3006693113bbc313979724e603b355
          path: .eliza-source

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Provision ripgrep for Linux static smoke
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          version=15.1.0
          case "${RUNNER_ARCH}" in
            X64) target=x86_64-unknown-linux-musl ;;
            ARM64) target=aarch64-unknown-linux-gnu ;;
            *)
              echo "::error::Unsupported runner architecture for ripgrep: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          archive="ripgrep-${version}-${target}.tar.gz"
          release_url="https://github.com/BurntSushi/ripgrep/releases/download/${version}"
          install_root="${RUNNER_TEMP}/ripgrep-${version}"
          mkdir -p "${install_root}"
          curl -fsSL "${release_url}/${archive}" -o "${install_root}/${archive}"
          curl -fsSL "${release_url}/${archive}.sha256" -o "${install_root}/${archive}.sha256"
          (cd "${install_root}" && sha256sum --check "${archive}.sha256")
          tar -xzf "${install_root}/${archive}" -C "${install_root}"
          bin_dir="${install_root}/ripgrep-${version}-${target}"
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${bin_dir}/rg" --version

      - run: bun run verify:linux
