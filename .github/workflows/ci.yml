name: OS verification

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Turbo task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Restore actionlint archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/elizaos/actionlint
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Provision pinned actionlint
        run: packages/os/scripts/provision-actionlint.sh

      - name: Lint GitHub Actions workflows
        run: actionlint

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify

  installer-native-linux-qualification:
    name: Native installer accepted-peer qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Qualify cross-process AF_UNIX credentials and pidfd lifecycle
        run: packages/os/linux/installer/native/test-qualify.sh

  linux-static-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/.eliza-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve pinned Eliza source
        id: eliza-source
        run: node packages/os/scripts/read-eliza-source-lock.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.eliza-source.outputs.repository }}
          ref: ${{ steps.eliza-source.outputs.commit }}
          path: .eliza-source
          submodules: recursive

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.eliza-source/bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision ripgrep for Linux static smoke
        shell: bash
        run: packages/os/scripts/provision-ripgrep.sh

      - run: bun run verify:linux

      - name: Validate canonical mkosi workstation contract
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cryptography
          bash packages/os/linux/elizaos/scripts/mkosi-lint.sh
          python3 -m unittest -v \
            packages/os/linux/elizaos/scripts/test_mkosi_qualification.py \
            packages/os/linux/elizaos/scripts/test_verify_desktop_artifact.py

  linux-usb-virtual-block:
    name: Canonical Linux USB virtual block-device proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Setup Bun from packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install source dependencies and kernel module tools
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kmod
          if ! modinfo scsi_debug >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends \
              "linux-modules-extra-$(uname -r)"
          fi
          modinfo scsi_debug >/dev/null

      - name: Exercise signed raw.zst write and expanded-byte readback
        run: bun run --cwd packages/os/usb-installer test:linux-virtual-usb
