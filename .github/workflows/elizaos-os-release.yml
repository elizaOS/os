name: ElizaOS OS release validation

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/elizaos-os-release.yml"
      - "**"
      - "packages/os/homepage/**"
      - "packages/os/usb-installer/**"
      - "packages/os/setup/**"

# Default to least privilege. Override per-job where needed.
permissions:
  contents: read

jobs:
  validate-os-release:
    name: Validate OS release surfaces
    runs-on: ${{ fromJSON(vars.HETZNER_FLEET_ONLINE == 'true' && '["self-hosted","hetzner-robot"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve pinned Eliza source
        id: eliza-source
        run: node packages/os/scripts/read-eliza-source-lock.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.eliza-source.outputs.repository }}
          ref: ${{ steps.eliza-source.outputs.commit }}
          path: .eliza-source
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', '.eliza-source/bun.lock') }}
          restore-keys: bun-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore Playwright Chromium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Verify application and OS repository ownership boundary
        env:
          ELIZAOS_ELIZA_ROOT: ${{ github.workspace }}/.eliza-source
        run: node scripts/verify-eliza-source-boundary.mjs

      - name: Validate OS release manifest
        run: |
          manifest=packages/os/release/v0.1.0-beta.1/manifest.json
          evidence=packages/os/release/v0.1.0-beta.1/evidence/ci-evidence.json

          for script in scripts/*.mjs packages/os/scripts/*.mjs; do
            node --check "$script"
          done
          node --test \
            packages/os/scripts/__tests__/os-release-scripts.test.mjs \
            packages/os/scripts/__tests__/release-asset-inventory.test.mjs
          node packages/os/scripts/validate-release-manifest.mjs \
            --manifest "$manifest"
          node packages/os/scripts/assert-canonical-linux-release.mjs \
            --manifest "$manifest"
          node packages/os/scripts/collect-release-evidence.mjs \
            --manifest "$manifest" \
            --output "$evidence"

      - name: Validate USB installer
        run: |
          set -euo pipefail
          bun run --cwd packages/os/usb-installer lint:check
          bun run --cwd packages/os/usb-installer typecheck
          bun run --cwd packages/os/usb-installer test
          bun run --cwd packages/os/usb-installer build
          bunx playwright install --with-deps chromium
          bun run --cwd packages/os/usb-installer test:e2e
          if ! modinfo scsi_debug >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          modinfo scsi_debug >/dev/null
          bun run --cwd packages/os/usb-installer test:linux-virtual-usb

      - name: Validate Android installer
        run: |
          packages/os/android/installer/tests/run-tests.sh
          node packages/os/android/installer/scripts/validate-release-manifest.mjs \
            packages/os/android/installer/manifests/android-release-manifest.example.json

      - name: Validate elizaos-setup (formerly aosp-flasher)
        run: |
          bun run --cwd packages/os/setup lint:check
          bun run --cwd packages/os/setup typecheck
          bun run --cwd packages/os/setup test
          bun run --cwd packages/os/setup build

      - name: Provision ripgrep for Linux metadata validation
        shell: bash
        run: packages/os/scripts/provision-ripgrep.sh

      - name: Validate Linux live USB metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-cryptography
          cd packages/os/linux
          export ELIZAOS_ELIZA_ROOT="${GITHUB_WORKSPACE}/.eliza-source"
          bash elizaos/scripts/mkosi-lint.sh
          python3 -m unittest -v \
            elizaos/scripts/test_mkosi_qualification.py \
            elizaos/scripts/test_verify_desktop_artifact.py

      - name: Validate OS homepage
        run: |
          bun run --cwd packages/os/homepage lint:check
          bun run --cwd packages/os/homepage typecheck
          bun run --cwd packages/os/homepage build
          (cd packages/os/homepage && bunx playwright install --with-deps chromium)
          bun run --cwd packages/os/homepage test:e2e

      - name: Capture homepage contact sheet
        run: |
          set -euo pipefail
          bun --bun --cwd packages/os/homepage vite preview --host 127.0.0.1 --port 4455 &
          echo $! > /tmp/os-homepage-preview.pid
          ready=0
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4455 >/dev/null; then
              ready=1
              break
            fi
            echo "Waiting for os-homepage preview (${attempt}/60)..."
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "ERROR: os-homepage preview never came up on 127.0.0.1:4455"
            kill "$(cat /tmp/os-homepage-preview.pid)" 2>/dev/null || true
            exit 1
          fi
          bun run --cwd packages/os/homepage screenshots
          kill "$(cat /tmp/os-homepage-preview.pid)" 2>/dev/null || true

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: elizaos-os-release-validation
          path: |
            packages/os/release/v0.1.0-beta.1/evidence/**
            packages/os/homepage/artifacts/screenshots/**
            packages/os/homepage/test-results/**
          if-no-files-found: error
          retention-days: 14
